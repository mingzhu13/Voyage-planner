<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyage en Crète</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f5fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #0b3b4f;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .sub {
            color: #4f6a7a;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .menu a {
            display: block;
            background: #e9f2f9;
            color: #0b3b4f;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: background 0.15s, transform 0.1s;
            border-left: 4px solid #2a7f9e;
        }
        .menu a:hover {
            background: #dceaf3;
            transform: translateX(4px);
        }
        .menu a .emoji {
            margin-right: 10px;
        }
        .menu a .badge {
            font-size: 0.7rem;
            font-weight: 400;
            color: #4f6a7a;
            background: #dce6ed;
            padding: 2px 12px;
            border-radius: 30px;
            margin-left: 8px;
        }
        .footer {
            margin-top: 30px;
            color: #8a9caa;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 Voyage en Crète</h1>
        <p class="sub">Septembre 2026 · Strasbourg ↔ Héraklion</p>
        <div class="menu">
            <a href="agenda_crete_interactif_2hotels.html">
                <span class="emoji">🗺️</span> Itinéraire complet
                <span class="badge">8 jours</span>
            </a>
            <a href="crete%20hotels.html">
                <span class="emoji">🏨</span> Hôtels recommandés
                <span class="badge">2 villes</span>
            </a>
        </div>
        <div class="footer">👆 Cliquez sur une page pour la consulter</div>
    </div>
</body>
</html>
